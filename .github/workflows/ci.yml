# Author: DrPlaga

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Python and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pytest>=8' 'ruff>=0.8'

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest

      - name: Compose config
        run: |
          docker compose config >/tmp/vpn-browser-compose.yaml
          scripts/validate-compose.py

      - name: Browser image build
        run: docker compose build browser

  shell-and-dockerfile:
    name: Shell and Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: browser/Dockerfile

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build browser image
        run: docker compose build browser

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vpn-browser-browser:local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
